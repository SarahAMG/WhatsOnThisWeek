<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>What's On This Week</title><style>
:root{--blue:#0050ff;--bg:#f5f6fa;--text:#111;--muted:#686b73;--card:#fff;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:720px;margin:0 auto;padding:22px 16px 42px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}h1{font-size:34px;line-height:1.02;letter-spacing:-1.3px;margin:0 0 8px}.intro{font-size:15px;line-height:1.45;color:var(--muted);margin:0 0 18px}.locationBar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:20px}.locationLabel{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.locationValue{font-size:16px;font-weight:800;margin-top:2px}.change{border:0;background:#eaf0ff;color:var(--blue);font-weight:800;border-radius:999px;padding:10px 13px;min-height:42px}.locationPicker{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:-8px 0 20px}.locationPicker h2{font-size:20px;margin:0 0 5px}.locationPicker p{font-size:13px;color:var(--muted);margin:0 0 13px}.cities{display:flex;flex-wrap:wrap;gap:8px}.city{border:1px solid #d8dbe2;background:#fff;border-radius:999px;padding:10px 13px;font-weight:700;min-height:42px}.city.active{background:var(--blue);border-color:var(--blue);color:#fff}.hidden{display:none!important}.weekLabel{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.art{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e9ebf0}.artFallback{aspect-ratio:16/9;background:linear-gradient(135deg,#111,#343434);display:flex;align-items:flex-end;padding:18px;color:#fff;font-weight:900;font-size:24px}.body{padding:16px}.date{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}.artist{font-size:23px;line-height:1.08;font-weight:900;letter-spacing:-.5px;margin:0 0 6px}.meta{font-size:14px;color:var(--muted);line-height:1.4;margin-bottom:14px}.ticket{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;font-size:14px}.state{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}.state strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}.loader{height:4px;background:#dfe5f3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.loader:after{content:"";display:block;width:42%;height:100%;background:var(--blue);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}h1{font-size:42px}}

.backstageBack{
  position:relative;z-index:50;display:inline-flex;align-items:center;gap:7px;
  margin:14px 16px 0;padding:9px 12px;border:0;background:transparent;
  color:#0050ff;font-family:Arial,sans-serif;font-size:12px;font-weight:900;
  text-decoration:none;cursor:pointer
}
.backstageBack:hover{text-decoration:underline}

</style></head><body>
<button type="button" class="backstageBack" id="backToBackstage" aria-label="Back to Backstage">← BACK TO BACKSTAGE</button>
<main><div class="eyebrow">Discover live</div><h1>What's on this week</h1><p class="intro">Your next night out could be closer than you think. See what's coming up over the next 7 days.</p><div id="locationBar" class="locationBar hidden"><div><div class="locationLabel">Your location</div><div id="locationValue" class="locationValue">Choose a city</div></div><button id="changeLocation" class="change" type="button">Change</button></div><section id="locationPicker" class="locationPicker"><h2>Where do you want to see shows?</h2><p>We'll remember this for next time.</p><div id="cities" class="cities"><span>Loading locations…</span></div></section><div id="loading" class="loader"></div><div id="weekLabel" class="weekLabel hidden"></div><section id="shows" class="grid" aria-live="polite"></section></main><script>
const SB="https://jiigtmxfepthdeorlnmv.supabase.co",KEY="sb_publishable_N37lWnFWPnDIRd7QBOEVpw_r13WPTyQ",LOCATION_KEY="amg_saved_location_v1";const showsEl=document.getElementById("shows"),citiesEl=document.getElementById("cities"),picker=document.getElementById("locationPicker"),bar=document.getElementById("locationBar"),locationValue=document.getElementById("locationValue"),changeBtn=document.getElementById("changeLocation"),loading=document.getElementById("loading"),weekLabel=document.getElementById("weekLabel");let allShows=[],selectedCity=null;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function localDateString(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d}function parseDateOnly(s){const [y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d)}function fmtDate(s){return parseDateOnly(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}function fmtLong(d){return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}function getSavedLocation(){try{return localStorage.getItem(LOCATION_KEY)}catch(e){return null}}function saveLocation(city){try{localStorage.setItem(LOCATION_KEY,city)}catch(e){}}function chooseCity(city){selectedCity=city;saveLocation(city);locationValue.textContent=city;picker.classList.add("hidden");bar.classList.remove("hidden");renderShows()}function renderCities(){const cities=[...new Set(allShows.map(s=>s.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b));if(!cities.length){citiesEl.innerHTML="<span>No locations with shows this week.</span>";return}citiesEl.innerHTML=cities.map(c=>`<button type="button" class="city ${selectedCity===c?"active":""}" data-city="${esc(c)}">${esc(c)}</button>`).join("");citiesEl.querySelectorAll(".city").forEach(btn=>btn.addEventListener("click",()=>chooseCity(btn.dataset.city)))}function renderShows(){if(!selectedCity){showsEl.innerHTML="";weekLabel.classList.add("hidden");return}const today=new Date();today.setHours(0,0,0,0);const end=addDays(today,6);end.setHours(23,59,59,999);weekLabel.textContent=`${fmtLong(today)} – ${fmtLong(end)} · ${selectedCity}`;weekLabel.classList.remove("hidden");const list=allShows.filter(s=>s.city===selectedCity&&s.event_date&&parseDateOnly(s.event_date)>=today&&parseDateOnly(s.event_date)<=end).sort((a,b)=>String(a.event_date).localeCompare(String(b.event_date))||String(a.artist).localeCompare(String(b.artist)));if(!list.length){showsEl.innerHTML=`<div class="state"><strong>Nothing listed this week</strong>There aren't any upcoming shows in ${esc(selectedCity)} over the next 7 days. Try another location.</div>`;return}showsEl.innerHTML=list.map(s=>{const imageSrc=s.image_url||defaultArtistImage;const img=imageSrc?`<img class="art" src="${esc(imageSrc)}" alt="" loading="lazy">`:`<div class="artFallback">${esc(s.artist||"Live music")}</div>`;const ticket=s.ticket_url?`<a class="ticket" href="${esc(s.ticket_url)}" target="_blank" rel="noopener">FIND TICKETS →</a>`:"";return `<article class="card" data-artist="${esc(s.artist||"")}" data-city="${esc(s.city||"")}">${img}<div class="body"><div class="date">${fmtDate(s.event_date)}</div><h2 class="artist">${esc(s.artist||"Upcoming show")}</h2><div class="meta">${esc(s.city||"")}</div>${ticket}</div></article>`}).join("")}async function loadShows(){try{const today=localDateString(),end=localDateString(addDays(new Date(),6));let rows=[],offset=0;while(true){const url=`${SB}/rest/v1/shows?select=id,artist,city,event_date,ticket_url,image_url,venue_id&event_date=gte.${today}&event_date=lte.${end}&order=event_date.asc&offset=${offset}&limit=1000`;const r=await fetch(url,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});if(!r.ok)throw new Error(`Show request failed (${r.status})`);const batch=await r.json();rows.push(...batch);if(batch.length<1000)break;offset+=1000}allShows=rows;loading.classList.add("hidden");renderCities();const saved=getSavedLocation(),available=new Set(allShows.map(s=>s.city).filter(Boolean));if(saved&&available.has(saved)){selectedCity=saved;locationValue.textContent=saved;picker.classList.add("hidden");bar.classList.remove("hidden");renderCities();renderShows()}else{picker.classList.remove("hidden");bar.classList.add("hidden");showsEl.innerHTML=""}}catch(err){loading.classList.add("hidden");picker.classList.add("hidden");showsEl.innerHTML=`<div class="state"><strong>We couldn't load shows</strong>Please try again shortly.</div>`;console.error(err)}}changeBtn.addEventListener("click",()=>{picker.classList.toggle("hidden");renderCities()});
async function trackPageEvent(eventType,extra={}){try{await fetch(`${SB}/rest/v1/page_analytics`,{method:"POST",headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({page_name:"whats_on_this_week",event_type:eventType,...extra})})}catch(e){console.warn("Analytics event not recorded",e)}}
document.addEventListener("click",e=>{const a=e.target.closest("a.ticket");if(a){const card=a.closest(".card");trackPageEvent("ticket_click",{artist:card?.dataset?.artist||null,city:card?.dataset?.city||selectedCity||null})}});
trackPageEvent("page_view");
loadShows();
</script>
<script>
document.getElementById("backToBackstage").addEventListener("click",function(){
  if (window.history.length > 1) window.history.back();
  else window.location.href = "https://o2-show-register.pages.dev/";
});
</script>

</body></html>
